# The gate the Makefile has claimed since M0.
#
# `make verify` has carried the comment "What CI runs on every commit" since the
# first commit, and until now nothing ran it. Five places in the documentation
# described CI as a thing that exists. This is the smallest change that makes
# those sentences true, and it belongs in the same repository as the claim.
#
# Deliberately not the whole suite. Integration tests need Postgres, MinIO,
# Keycloak and now a telemetry stack, and the honest split is already drawn in
# the Makefile:
# `make verify` is lint plus the tests that need no stack, and it is what a
# contributor can run locally before pushing. Standing the full compose stack up
# in CI is worth doing when there is something CI would catch that a developer
# running `make up` would not.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push to the same branch cancels the first: the older run's verdict
  # is about code nobody will merge.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the version the Dockerfile builds on and the version
          # pyproject declares, so a passing gate means the same interpreter
          # that runs in the container.
          python-version: "3.12"
          cache: pip

      # [dev,fixtures], not [dev]. `make test` runs tests/unit, which includes
      # test_fixture_layouts.py, which renders real PDFs through reportlab --
      # and reportlab is in the fixtures extra because the service reads
      # documents and never writes them. Installing only [dev] makes the gate
      # this repository documents fail on a clean checkout.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev,fixtures]"

      # lint + the alert-rule tests + the unit suite + the extraction gate.
      #
      # Two of those need more than Python. `check-alerts` runs promtool from
      # the pinned Prometheus image, because the rules are PromQL and only
      # Prometheus can say what PromQL means. `eval-check` renders four hundred
      # PDFs through reportlab and reads them back through pypdf, which is why
      # the install above is [dev,fixtures] rather than [dev]. Neither needs the
      # compose stack; both need the runner's Docker and its renderer.
      - name: make verify
        run: make verify

      # Separate step so a formatting failure and a type failure are
      # distinguishable at a glance in the checks list, rather than both
      # reading as "make verify failed".
      - name: mypy --strict over the seed generators
        run: python -m mypy --strict seeds/

      - name: Migrations are reversible in isolation
        # Not the database round trip -- that needs Postgres. This asserts the
        # weaker property CI can check without a stack: every revision file
        # imports, the revision graph is linear and single-headed, and every
        # upgrade has a downgrade. A branched history is the failure that turns
        # a deploy into an outage, and it is invisible until someone deploys.
        run: python scripts/check_migration_graph.py

  terraform:
    # The deployment description, checked and never applied. `terraform
    # validate` says the configuration is well-formed and internally consistent;
    # it does not say AWS would accept it, and infra/aws/README.md does not
    # claim otherwise. Applying it would cost money to host a demo nobody
    # visits, and would prove less than the interface that makes moving there a
    # configuration change.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/aws

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # The version `make tf-validate` pins in its container, so a passing
          # gate here means the same Terraform a developer ran locally.
          terraform_version: "1.9.8"

      - name: Formatting
        run: terraform fmt -check -diff

      # -backend=false: there is no state to talk to, and a module should not
      # carry a backend anyway -- that belongs to the environment that owns it.
      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  console:
    # The only TypeScript in the repository, and until this job it was checked
    # by nothing. Its own `lint` script had been broken from the start: it
    # called `next lint`, which Next 16 removed, and which now reads "lint" as a
    # directory name and fails.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version the console's Dockerfile builds on.
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci

      # Types and lint as separate steps, for the same reason as above: which
      # one failed should be visible without opening the log.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The build is the check that the App Router accepts the tree: server and
      # client component boundaries, route handler signatures, and that nothing
      # server-only has leaked into the client bundle.
      - name: Build
        run: npm run build
