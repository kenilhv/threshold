# One command brings the whole system up:  make up   (or: docker compose up -d)
#
# Every dependency here has a healthcheck and every consumer waits on it with
# `condition: service_healthy`. Without that, `docker compose up` races: the API
# starts before Postgres accepts connections, crashes, restarts, and the first
# experience a stranger has of this project is a crash loop.
#
# Cloud mapping — the only things that change are the endpoint and the
# credential source, which is why boto3 is used locally rather than a MinIO SDK:
#   postgres  -> RDS Postgres          minio    -> S3
#   redis     -> ElastiCache           keycloak -> Cognito / an existing IdP
#   api,worker-> ECS Fargate tasks

name: threshold

x-app-env: &app-env
  THRESHOLD_ENVIRONMENT: local
  THRESHOLD_LOG_LEVEL: INFO
  THRESHOLD_DATABASE_URL: postgresql+asyncpg://threshold:threshold@postgres:5432/threshold
  THRESHOLD_REDIS_URL: redis://redis:6379/0
  THRESHOLD_S3_ENDPOINT_URL: http://minio:9000
  THRESHOLD_S3_ACCESS_KEY_ID: minioadmin
  THRESHOLD_S3_SECRET_ACCESS_KEY: minioadmin
  THRESHOLD_S3_BUCKET_DOCUMENTS: threshold-documents
  # What a token must claim, exactly.
  THRESHOLD_OIDC_ISSUER: http://localhost:8080/realms/threshold
  # Where this process can actually reach the signing keys. Deliberately not
  # derived from the issuer: the issuer is an identity and this is a route, and
  # inside the compose network the route is a different host.
  THRESHOLD_OIDC_JWKS_URL: http://keycloak:8080/realms/threshold/protocol/openid-connect/certs
  # OTLP base URLs; the SDK appends /v1/traces and /v1/metrics. Two of them
  # because they really are two backends -- spans to Tempo, metrics to
  # Prometheus's OTLP receiver -- and collapsing them would mean running a
  # collector on this host for no purpose but to fan out two streams.
  THRESHOLD_OTEL_TRACES_ENDPOINT: http://tempo:4318
  THRESHOLD_OTEL_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp

services:
  # Every long-running service restarts; the one-shot jobs (migrate, seed,
  # minio-init) deliberately do not. The dependencies were missing this until
  # a Docker VM restart proved why it matters: api, worker and console came back
  # on their own, Postgres, Redis, MinIO and Keycloak did not, and the stack sat
  # half-up for eleven hours with the API reporting healthy against a database
  # that was not running. Liveness said yes because liveness is not readiness.
  postgres:
    # pgvector ships in the same image as Postgres 16. One datastore of record,
    # including vectors: same transaction, same backup, same restore drill.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: threshold
      POSTGRES_PASSWORD: threshold
      POSTGRES_DB: threshold
      # Deterministic collation so ORDER BY is identical on every machine.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threshold -d threshold"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis holds only replayable state — idempotency-key cache, locks, rate
    # limits. Nothing here is durable, so it is started with persistence off on
    # purpose: an accidental restore of stale locks is worse than a cold cache.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    # Creates the bucket and exits. Idempotent, so `up` twice is safe.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/threshold-documents &&
      mc version enable local/threshold-documents &&
      echo 'bucket ready (versioning on)'
      "
    restart: "no"

  keycloak:
    # Real OIDC rather than hand-rolled JWT. The realm is committed as JSON so
    # roles are reproducible instead of clicked into existence.
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Pinned so `iss` is stable. Keycloak 26 otherwise derives the issuer from
      # the request Host, which means a browser logging in at localhost:8080 is
      # handed a token claiming a different issuer than a service calling
      # keycloak:8080 would expect -- and an issuer check that is exact, as it
      # must be, then rejects every real token. Pinning it makes `iss` a
      # constant and moves the container-vs-browser split to where it belongs:
      # the JWKS URL, which is a network address rather than an identity.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/local/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak 26 serves health on the management port 9000, not 8080.
      test:
        ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  migrate:
    # Runs to completion before api and worker start. Migrations are a separate
    # unit of work, never an app-startup side effect: two API replicas racing to
    # migrate the same database is a real outage and an easy one to avoid.
    build:
      context: .
      target: runtime
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  seed:
    build:
      context: .
      target: runtime
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.seed"]
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *app-env
      THRESHOLD_SERVICE_NAME: threshold-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command:
      ["uvicorn", "threshold.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # The long-running services restart; the one-shot jobs above deliberately do
    # not. This is the backstop, not the mechanism: the worker already retries a
    # failed claim in-process with backoff, because a pool that needs Docker to
    # notice a ten-second Postgres blip has already dropped the work it held.
    # What this covers is the case in-process handling cannot — a crash.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  console:
    # The operator console. A back-end for front-end: it holds the access token
    # server-side and the browser never sees one, because this is the surface
    # that authorises payment and an XSS on a page rendering vendor-supplied
    # invoice text would otherwise hand out a bearer token for it.
    build:
      context: ./console
    environment:
      # The issuer the browser is redirected to, and the one this container can
      # reach, are different hosts for the same Keycloak. Deriving either from
      # the other is what makes a correct issuer check reject every real token.
      THRESHOLD_OIDC_PUBLIC_ISSUER: http://localhost:8080/realms/threshold
      THRESHOLD_OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/threshold
      THRESHOLD_OIDC_CLIENT_ID: threshold-console
      THRESHOLD_CONSOLE_ORIGIN: http://localhost:3000
      THRESHOLD_API_URL: http://api:8000
      # Local only: the console is served over plain HTTP at localhost, so a
      # Secure cookie would never be sent back and nobody could sign in.
      THRESHOLD_INSECURE_COOKIES: "1"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      target: runtime
    environment:
      <<: *app-env
      THRESHOLD_SERVICE_NAME: threshold-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "-m", "threshold.workers.main"]
    restart: unless-stopped

  # ------------------------------------------------------------- telemetry ---
  # Metrics are PUSHED to Prometheus over OTLP rather than scraped. That is the
  # unusual choice here, and it is deliberate: the worker has no HTTP server, so
  # a scrape model would mean giving it one purely to be scraped, or running a
  # collector to scrape on its behalf. Prometheus 3 can receive OTLP directly,
  # which removes both. The trade is that push has no `up` metric and no scrape
  # staleness, so an alert on "the worker stopped reporting" has to be written
  # with absent() rather than by waiting for a series to vanish -- a pushed
  # series stays queryable for the 5m lookback and then simply stops answering.
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      # Supplying `command` replaces the image's default, so the config and
      # storage paths have to be restated or Prometheus looks for /prometheus.yml
      # and exits.
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # The one flag that creates POST /api/v1/otlp/v1/metrics. Without it the
      # path 404s and the exporter retries for ever against a healthy server.
      - --web.enable-otlp-receiver
    volumes:
      - ./infra/local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      # No curl in this image.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/local/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      # 3200 is the query API, which `make smoke` reads a trace back through.
      # 4317/4318 stay on the compose network; nothing on the host pushes spans.
      - "3200:3200"
    restart: unless-stopped
    # The one service here without a healthcheck, and not by oversight. The
    # image is distroless: no shell, no wget, no curl, so a `test:` has nothing
    # to run and `CMD-SHELL` fails with "sh: executable file not found". Tempo
    # does serve /ready -- `make smoke` checks it from the host, which is where
    # a check with a working HTTP client lives.

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      # LOCAL ONLY, all four. Anonymous viewing with no login form means anyone
      # who can reach the port is a signed-in Viewer; this is a demo on a laptop
      # and the alternative is a password prompt between a stranger and the
      # point of the project. Anything reachable beyond this host drops these
      # and puts real auth in front.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Not a relaxation: this one is hardening, and it is safe anywhere.
      GF_AUTH_BASIC_ENABLED: "false"
      # Without this an anonymous Viewer gets a 302 on /explore, so every
      # click-through from a panel into a trace dies silently -- the row
      # highlights and nothing opens.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/threshold.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      # Mounted one directory deeper than /etc/grafana/provisioning, which would
      # hide the image's own plugins/ and alerting/ subdirectories and log two
      # errors on every boot that look like provisioning failed.
      - ./infra/local/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/local/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # 3001, because 3000 is the console.
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        # Started, not healthy: Tempo has no healthcheck to wait on (see
        # above), and Grafana tolerates a datasource that is not answering yet.
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  tempo-data:
  grafana-data:
