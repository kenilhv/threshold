apiVersion: 1

# The uids here are a contract. Dashboard JSON references them by string, and
# changing one turns every panel into "Datasource not found" without failing
# anything at provisioning time.

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    # The files are the source of truth. A dashboard edited in the UI and not
    # in the repository is a change that survives until the next restart.
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    orgId: 1
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
