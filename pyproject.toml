[project]
name = "threshold"
version = "0.1.0"
description = "An accounts-payable control plane that holds the line between what a machine may execute alone and what a human must decide."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "boto3>=1.35",
    "structlog>=24.4",
    # RS256 verification needs the crypto extra; without it PyJWT raises at
    # decode time rather than at import, which is a runtime 500 on the auth path.
    "pyjwt[crypto]>=2.9",
    # Runtime dependencies, not an optional extra: the Dockerfile installs the
    # project plainly, so an extra never reaches the image that runs in compose.
    #
    # The instrumentation packages are versioned 0.NNbN by OpenTelemetry for
    # every release -- that is the project's contrib numbering, not a pre-release
    # nobody has finished. 0.65b0 is the line that pairs with sdk 1.44; both pin
    # the same opentelemetry-semantic-conventions, so the two trains cannot
    # drift apart.
    #
    # proto-http rather than proto-grpc: no grpcio wheel to build, and no
    # grpc-in-asyncio caveats to reason about on a path that must never be able
    # to affect a request.
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-botocore>=0.65b0",
    "python-multipart>=0.0.20",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-boto3>=1.35",
]

# Fixture generation only. Deliberately not a runtime dependency: the service
# reads documents, it never writes them, and the golden set is built offline.
fixtures = [
    "reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Strict by default. The point of this project is that its guarantees are
# checkable, and an untyped boundary is a guarantee nobody can check.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false          # SQLAlchemy and boto3 stubs need some
plugins = []
mypy_path = "src"
packages = ["threshold"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # import sorting
    "N",               # naming
    "UP",              # pyupgrade
    "B",               # bugbear
    "A",               # shadowing builtins
    "C4",              # comprehensions
    "DTZ",             # naive datetimes — money systems must not have them
    "T20",             # no print()
    "SIM",             # simplify
    "RUF",
]
ignore = ["B008"]      # FastAPI's Depends() in defaults is the documented idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# A CLI's entire job is writing to stdout. T20 exists to stop stray debug
# prints in library code, which is a different thing.
"tests/unit/test_seed_coupling.py" = ["E402"]  # repo root must reach sys.path first
"scripts/check_migration_graph.py" = ["T201"]
"scripts/queuectl.py" = ["T201"]
"scripts/check_console.py" = ["T201", "E402", "S101"]
# Same reasoning: a demo that printed nothing would demo nothing. E402 is
# unavoidable here because the repo root has to be on sys.path before the
# fixture generator can be imported.
"scripts/demo_three_way_match.py" = ["T201", "E402"]
"migrations/*" = ["N999", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires the docker compose stack to be running",
]
